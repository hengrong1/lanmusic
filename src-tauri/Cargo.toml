[package]
name = "lanmusic"
version = "0.2.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lanmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
lofty = "0.25.1"
walkdir = "2.5.0"
notify = "7"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
image = { version = "0.25.10", features = ["jpeg", "png"] }
quick-xml = "0.42.0"
url = "2.5.8"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
percent-encoding = "2.3.2"

[target."cfg(windows)".dependencies]
# 版本与 tauri 传递依赖保持一致（0.61.x），避免重复编译两份 windows crate
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# 系统字体枚举（DirectWrite 字体集合）；Globalization 取用户区域以挑本地化字族名
# （DirectWrite 与 Win32_Foundation 等共用上方同一份 windows crate 依赖）

[target."cfg(target_os = \"macos\")".dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSWindow", "objc2-core-foundation"] }

