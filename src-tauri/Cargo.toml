[package]
name = "lanmusic"
version = "0.5.15"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lanmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
# 落盘日志：初始化见 lib.rs（系统日志目录 + 开发期 stdout），业务代码统一用 log 宏
tauri-plugin-log = "2"
# 日志门面（与 tauri 传递依赖同版本 0.4，不额外编译）
log = "0.4"
# 更新包下载后的 SHA-256 校验（纯 Rust 实现，见 updater.rs）
sha2 = "0.10"
# collation：自定义排序规则（中文按拼音排序，见 db.rs::open_conn 注册 PINYIN）
rusqlite = { version = "0.40.2", features = ["bundled", "collation"] }
lofty = "0.25.1"
# 歌词文件编码识别：QQ 生态歌词常见 GBK/GB18030，按 UTF-8 读会乱码（见 lyrics.rs decode_lyric_bytes）
encoding_rs = "0.8"
# 拼音搜索：汉字转全拼/首字母（搜索匹配用，见 search.rs）
pinyin = "0.10"
# QRC 逐字歌词解密：QQ 改版三重 DES（自移植，见 qrc.rs；标准 DES 位序不适用于 QQ 歌词）
miniz_oxide = "0.8"
walkdir = "2.5.0"
notify = "7"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
image = { version = "0.25.10", features = ["jpeg", "png"] }
quick-xml = "0.42.0"
url = "2.5.8"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
percent-encoding = "2.3.2"

[target."cfg(windows)".dependencies]
# 更新通道读系统代理（IE/WinINET 注册表设置，见 updater.rs::system_proxy）；
# 版本与依赖图里已有的一致（transitive），不新增编译量
winreg = "0.55"
# 版本与 tauri 传递依赖保持一致（0.61.x），避免重复编译两份 windows crate
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# 系统字体枚举（DirectWrite 字体集合）；Globalization 取用户区域以挑本地化字族名
# （DirectWrite 与 Win32_Foundation 等共用上方同一份 windows crate 依赖）

[target."cfg(target_os = \"macos\")".dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSWindow", "objc2-core-foundation"] }
# macOS WKWebView 不支持 Ogg(Vorbis) 解码：播放前在 Rust 侧转码为 WAV（见 transcode.rs）。
# 注意 symphonia 0.5 尚未发布 Opus 解码器，Opus-in-Ogg 暂不支持（失败时降级原样供流）
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }

# --- 关闭增量编译 ---
# 本机 rustc 1.98.0 在持久化增量元数据时偶发「拒绝访问 (os error 5)」，
# 且该失败只产出 warning 并仍以 0 退出，留下「自称新鲜但缺数据」的缓存，
# 导致**下一次**构建在 rmeta/encoder.rs 的 encode_metadata 处 ICE
# （no entry found for key → exit 101）。详见 .workbuddy/memory/MEMORY.md。
# Cargo 的 incremental 只作用于 workspace 本地 crate（第三方依赖始终不用增量），
# 因此这里关掉即精准覆盖 lanmusic 本体，增量收益本来就有限，换取构建确定性。
[profile.dev]
incremental = false

# 注：[profile.test] / clippy 均派生自 dev，会自动继承上面的设置。

