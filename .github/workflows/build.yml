name: Build & Release

# 触发方式：
# 1. 推送 v* 标签（如 git tag v0.4.1 && git push origin v0.4.1）→ 构建并创建 GitHub Release（草稿）
# 2. 手动在 Actions 页面点 Run workflow
#
# 产物说明：
# - macOS：tauri-action 产出 .dmg（targets 见 src-tauri/tauri.macos.conf.json）
# - Windows：bundle.targets 为空（主配置），tauri build 只产出 exe，
#   安装包统一由 Inno Setup 编译（installer/LanMusic.iss）——与本地
#   installer/build.ps1 同一套脚本逻辑
# - 应用内更新已切换为自研（检查 GitHub Release → 引导下载安装包，
#   见 src-tauri/src/updater.rs），不再产出/消费签名 latest.json

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  build-macos:
    strategy:
      fail-fast: false # 某个平台失败不影响其他平台继续出包
      matrix:
        include:
          # macOS Apple Silicon（M 系列）：原生编译
          - platform: macos-latest
            target: aarch64-apple-darwin
          # macOS Intel：在 M 芯片 runner 上交叉编译（Xcode 工具链原生支持）
          - platform: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 版本读取 package.json 的 packageManager 字段
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 按 target 缓存 Cargo 编译产物，二次构建快很多
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: pnpm install

      - name: Build dmg
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 版本号取自 src-tauri/tauri.conf.json 的 version，__VERSION__ 会自动替换
          tagName: v__VERSION__
          releaseName: 'LanMusic v__VERSION__'
          releaseBody: '安装包未签名：macOS 首次打开请右键→打开（或 `xattr -cr /Applications/LanMusic.app`）；Windows SmartScreen 提示选择「仍要运行」。'
          releaseDraft: true # 产出为草稿 Release，检查无误后手动 Publish
          prerelease: false
          args: --target ${{ matrix.target }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x86_64

      - name: Install frontend deps
        run: pnpm install

      # bundle.targets 为空：只产出 target/release/lanmusic.exe，不做 bundle
      - name: Build exe
        run: npm run tauri:build

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "未找到 ISCC.exe" }
          # 安装包文件名固定用三段版本（取 tauri.conf.json）：exe 的文件版本是四段
          # （0.5.5.0），拿它当产物名会让应用内更新按三段拼出的资产地址 HEAD 404
          # → 永远退化为「前往下载页」（见 src-tauri/src/updater.rs::asset_urls）
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if (-not $v) { throw "未能从 src-tauri/tauri.conf.json 读到 version" }
          & $iscc "/DMyAppVersionShort=$v" installer/LanMusic.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 打包失败" }
          # 生成 SHA-256 校验文件（应用内更新下载后校验，见 src-tauri/src/updater.rs）
          $setup = Get-ChildItem installer/output/*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$($setup.FullName).sha256" -Value $hash -NoNewline -Encoding ascii

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=v$v" >> $env:GITHUB_OUTPUT

      # 与 macOS job 写入同一个草稿 Release（tag 相同自动合并）
      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          draft: true
          fail_on_unmatched_files: true
          files: installer/output/*
